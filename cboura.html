<script>
$(document).ready(function()
{
var timerPageHeader = null;
function PageHeaderHide()
{
   var isTouch = (('ontouchstart' in window) || (navigator.msMaxTouchPoints > 0));
   if (isTouch)
      return;
   timerPageHeader = setTimeout(function()
   {
      $('#PageHeader').hide();
      $('#PageHeader_sensitive').show();
   }, 2000);
}
PageHeaderHide();
$('#PageHeader_sensitive').on("mouseenter", function()
{
   clearTimeout(timerPageHeader);
   if ($('#PageHeader_sensitive').is(":visible"))
   {
      $('#PageHeader_sensitive').hide();
      $('#PageHeader').show();
   }
});
$('#PageHeader').on("mouseleave",function()
{
   PageHeaderHide();
});
   function skrollrInit()
   {
      skrollr.init({forceHeight: false, mobileCheck: function() { return false; }, smoothScrolling: false});
   }
   skrollrInit();
   if (navigator.userAgent.indexOf('Safari') != -1 && navigator.userAgent.indexOf('Chrome') == -1) {$('#preloader').remove();}
});
$(window).on('load', function()
{
   $('#preloader').remove();
});
</script>
